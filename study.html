<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Junction school | JS Driving School</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=6" />
  <style>
    .study-hero { padding:120px 0 48px; }
    .tabs { display:flex; gap:8px; flex-wrap:wrap; margin:18px 0 22px; }
    .tabs button { border:1px solid #e4e4e7; background:#fff; border-radius:999px; padding:10px 14px; font-weight:600; cursor:pointer; }
    .tabs button.on { background:#111; color:#fff; border-color:#111; }
    .study-grid { display:grid; grid-template-columns:1.2fr .8fr; gap:22px; align-items:start; }
    .stage { background:#e7efe0; border-radius:20px; overflow:hidden; border:1px solid #e4e4e7; }
    .stage svg { width:100%; height:auto; display:block; }
    .learner { offset-rotate:auto; animation:drive 9s linear infinite; }
    .ind { fill:#ffb000; opacity:0; animation:blink 9s linear infinite; }
    @keyframes drive { to { offset-distance:100%; } }
    @keyframes blink { 0%,44% { opacity:0; } 48%,52% { opacity:1; } 56% { opacity:0; } 60%,64% { opacity:1; } 68% { opacity:0; } 72%,76% { opacity:1; } 80% { opacity:0; } 84%,88% { opacity:1; } 92% { opacity:0; } 96%,100% { opacity:1; } }
    .steps { display:grid; gap:10px; }
    .steps button { text-align:left; border:1px solid #ececef; background:#fff; border-radius:14px; padding:14px; cursor:pointer; }
    .steps button.on { border-color:#6142ff; }
    .steps b { display:block; }
    .steps span { color:#6e6e6e; }
    .tab[data-step="1"] .learner, .tab[data-step="1"] .ind { animation-delay:0s; }
    .tab[data-step="2"] .learner, .tab[data-step="2"] .ind { animation-delay:-1.8s; }
    .tab[data-step="3"] .learner, .tab[data-step="3"] .ind { animation-delay:-3.6s; }
    .tab[data-step="4"] .learner, .tab[data-step="4"] .ind { animation-delay:-5.4s; }
    .tab[data-step="5"] .learner, .tab[data-step="5"] .ind { animation-delay:-7.2s; }
    @media (max-width:900px) { .study-grid { grid-template-columns:1fr; } .study-hero { padding-top:100px; } }
    @media (prefers-reduced-motion:reduce) { .learner, .ind { animation:none; } .ind { opacity:1; } }
  </style>
</head>
<body>
  <header class="site">
    <div class="wrap nav">
      <a class="brand" href="index.html"><span class="mark">JS</span><span>JS Driving School<small>FEATHERSTONE</small></span></a>
      <nav class="nav-links" id="nav">
        <a href="index.html#lessons">Lessons</a>
        <a href="index.html#prices">Prices</a>
        <a href="study.html">Study</a>
        <a href="index.html#book">Book</a>
      </nav>
      <button class="menu-btn" aria-label="Menu" onclick="document.getElementById('nav').classList.toggle('open')">☰</button>
    </div>
  </header>
  <main class="wrap study-hero">
    <a href="index.html">Back to site</a>
    <p class="eyebrow">Study</p>
    <h1>Junction school</h1>
    <p class="sub">Top-down drills. The red car is you, on the left, moving clockwise. The left indicator comes on after the first exit.</p>
    <div class="tabs" id="tabs">
      <button class="on" data-tab="straight">Straight ahead</button>
      <button data-tab="left">First exit</button>
      <button data-tab="right">Right turn</button>
      <button data-tab="cross">Crossroads</button>
    </div>
    <div id="panels"></div>
    <p style="margin-top:22px"><a class="btn btn-violet" href="index.html#book">Book a lesson</a></p>
  </main>
  <script>
    const base = `
      <rect width="640" height="640" fill="#d7e6c8"/>
      <rect x="250" y="0" width="140" height="640" fill="#9aa0a6"/>
      <rect x="0" y="250" width="640" height="140" fill="#9aa0a6"/>
      <circle cx="320" cy="320" r="168" fill="#9aa0a6"/>
      <circle cx="320" cy="320" r="78" fill="#6fbf4a" stroke="#f7f7f7" stroke-width="12"/>
      <circle cx="320" cy="320" r="118" fill="none" stroke="#fff" stroke-dasharray="14 12" stroke-width="3"/>
      <circle cx="320" cy="320" r="150" fill="none" stroke="#fff" stroke-dasharray="14 12" stroke-width="2"/>
      <path d="M300 250 h40 M300 390 h40 M250 300 v40 M390 300 v40" stroke="#fff" stroke-width="4"/>
      <path d="M292 318 h56 M320 292 v56" stroke="#1c1c1c" stroke-width="7"/>
    `;
    const scenes = {
      straight: {
        title: "Straight ahead",
        path: "M292 620 V470 A150 150 0 0 1 292 170 V20",
        steps: [
          ["Approach", "Bottom road, left lane. No signal yet. Hold the centre of the lane."],
          ["Give way", "Look right. Join only when the lane is clear."],
          ["First exit", "Pass the left exit. Do not leave. Stay on the circular path."],
          ["Indicate", "Left indicator starts as you pass that first exit."],
          ["Second exit", "Steer off at the top and drive straight out of the frame."]
        ]
      },
      left: {
        title: "First exit",
        path: "M292 620 V470 A150 150 0 0 1 170 292 H20",
        steps: [
          ["Approach", "Left lane. Signal left before the line."],
          ["Give way", "Traffic from the right has priority."],
          ["Enter", "Turn left onto the roundabout and hold the lane."],
          ["Signal", "Keep the left indicator on."],
          ["Exit", "Leave at the first exit, on the left."]
        ]
      },
      right: {
        title: "Right turn",
        path: "M348 620 V470 A150 150 0 1 1 470 348 H620",
        steps: [
          ["Approach", "Right lane. Signal right."],
          ["Give way", "Wait for a gap from the right."],
          ["Enter", "Stay on the inner lane, clockwise."],
          ["Indicate left", "After the straight-ahead exit, the left indicator comes on."],
          ["Exit", "Leave on the right-hand road."]
        ]
      },
      cross: {
        title: "Controlled crossroads",
        path: "M292 620 V390 H470 V250 H292 V20",
        steps: [
          ["Approach", "Mirrors, signal, position. Lose speed early."],
          ["Observe", "Lights, oncoming cars, people crossing."],
          ["Stop at red", "Stop behind the line."],
          ["Green", "Go only when the path is clear."],
          ["Complete", "Cancel the signal and pull away straight."]
        ]
      }
    };
    function panel(key, scene) {
      const map = key === "cross" ? `<rect width="640" height="640" fill="#d7e6c8"/><rect x="250" y="0" width="140" height="640" fill="#9aa0a6"/><rect x="0" y="250" width="640" height="140" fill="#9aa0a6"/><circle cx="236" cy="236" r="9" fill="#e23b3b"/><circle cx="404" cy="404" r="9" fill="#3dd68c"/>` : base;
      return `<section class="tab study-grid" id="${key}" data-step="1" ${key==="straight"?"":"hidden"}><div class="stage"><svg viewBox="0 0 640 640">${map}<path d="${scene.path}" fill="none" stroke="#3dd68c" stroke-width="5" stroke-linecap="round" opacity=".85"/><g class="learner" style="offset-path:path('${scene.path}')"><rect x="-18" y="-9" width="36" height="18" rx="4" fill="#d23b3b"/><rect x="8" y="-6" width="7" height="12" fill="#ffd7d7"/><circle class="ind" cx="-12" cy="-7" r="2.4"/><circle class="ind" cx="-12" cy="7" r="2.4"/></g></svg></div><div><h2>${scene.title}</h2><div class="steps">${scene.steps.map((s,i)=>`<button class="${i===0?"on":""}" onclick="jump('${key}',${i+1},this)"><b>${i+1} ${s[0]}</b><span>${s[1]}</span></button>`).join("")}</div></div></section>`;
    }
    document.getElementById("panels").innerHTML = Object.entries(scenes).map(([k,v]) => panel(k,v)).join("");
    document.getElementById("tabs").addEventListener("click", (e) => { const btn = e.target.closest("button"); if (!btn) return; document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b === btn)); document.querySelectorAll(".tab").forEach(p => p.hidden = p.id !== btn.dataset.tab); });
    function jump(id, n, btn) { document.getElementById(id).dataset.step = n; btn.parentElement.querySelectorAll("button").forEach(b => b.classList.remove("on")); btn.classList.add("on"); }
  </script>
</body>
</html>
